<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Favoritos - Pokédex Interativa</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Pokémons Favoritos</h1>
    <div class="controls">
      <button id="toggleTheme">🌙 Tema</button>
      <a href="index.html" class="favoritos-btn">🏠 Voltar</a>
      <button id="clearFavoritesBtn">🗑️ Limpar Favoritos</button>
      </div>
  </header>

  <main id="pokemonContainer" class="pokemon-container"></main>

  <div id="pokemonModal" class="modal hidden">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="feedbackNotification" class="feedback-notification hidden"></div>

<script src="favoritos.js"></script>
</body>
</html>
